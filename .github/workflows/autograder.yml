name: ML Workshop Autograder
on:
  pull_request_target:
    branches: [ development ]  # Triggers when a PR targets the development branch

jobs:
  grade:
    runs-on: ubuntu-latest
    environment: "Action Workflows"
    permissions:
      contents: read
      models: read
    steps:
      - name: Checkout Student Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: student_repo

      - name: Checkout Private Grader
        uses: actions/checkout@v4
        with:
          repository: NUS-ISS-SS/mla-day1-workshop-master
          token: ${{ secrets.GRADER_ACCESS_TOKEN }}
          path: master_repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas scikit-learn nbformat numpy scipy requests

      - name: Run Grading
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p student_work
          cp student_repo/Test-housing.ipynb student_work/
          python master_repo/grader/evaluator.py > result.txt 2>&1 || { cat result.txt; exit 1; }
          cat result.txt
          SCORE=$(grep "^SCORE:" result.txt | cut -d':' -f2 | tr -d ' ')
          SCORE=${SCORE:-0}
          RMSE=$(grep "^RMSE:" result.txt | cut -d':' -f2 | tr -d ' ')
          BRANCH="${{ github.event.pull_request.head.ref }}"
          SUFFIX="${BRANCH#submission/}"
          FULLNAME_RAW="${SUFFIX#*-}"
          FULLNAME="${FULLNAME_RAW//-/ }"
          echo "STUDENT_SCORE=$SCORE" >> $GITHUB_ENV
          echo "STUDENT_RMSE=$RMSE" >> $GITHUB_ENV
          echo "STUDENT_FULLNAME=$FULLNAME" >> $GITHUB_ENV

      - name: Send Score to Master Leaderboard
        run: |
          curl -f \
            -H "Authorization: token ${{ secrets.GRADER_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -X POST \
            -d "{\"event_type\": \"update_score\", \"client_payload\": {\"user\": \"${{ github.actor }}\", \"fullname\": \"${{ env.STUDENT_FULLNAME }}\", \"score\": ${{ env.STUDENT_SCORE }}, \"rmse\": \"${{ env.STUDENT_RMSE }}\"}}" \
            https://api.github.com/repos/NUS-ISS-SS/mla-day1-workshop-master/dispatches
